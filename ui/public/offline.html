<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#222323" />
  <title>网络暂不可用 · 美股研究</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #222323; color: #f5f5f3; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 420px); }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #c4c7c5; margin: 0 0 24px; }
    button { font: inherit; color: #222323; background: #e6a265; border: 0; border-radius: 6px; padding: 11px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>网络暂不可用</h1>
    <p>选股数据和 SEC 披露需要联网获取。连接恢复后重试，避免使用过期信息做判断。</p>
    <button type="button" onclick="location.reload()">重试连接</button>
  </main>
</body>
</html>
