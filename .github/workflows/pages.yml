name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "35 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.6
      - run: npm --prefix ui ci --no-audit --no-fund
      - name: Prepare Pages base path
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/$repo/" >> "$GITHUB_ENV"
          fi
      - name: Refresh validated US stock snapshot
        run: node scripts/refresh_mobile_data.mjs --force
      - name: Build installable PWA
        run: npm --prefix ui run build
        env:
          VITE_DATA_MODE: static
          VITE_STATIC_HOST: "true"
      - name: Verify deployment data
        shell: bash
        run: |
          test -s ui/dist/data/manifest.json
          test -s ui/dist/data/snapshot.parquet
          test -s ui/dist/manifest.webmanifest
          test -s ui/dist/sw.js
          touch ui/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
