name: pages

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "scripts/**"
      - "paper/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "35 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.6
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: python -m unittest discover -s scripts -p test_paper_portfolio.py
      - name: Prepare Pages base path
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/$repo/" >> "$GITHUB_ENV"
          fi
      - name: Refresh validated US stock snapshot
        run: node scripts/refresh_mobile_data.mjs --force
      - name: Advance paper portfolio only on fresh closes
        run: python scripts/make_paper_portfolio.py --data-dir ui/public/data --ledger paper/ledger.json --output ui/public/data/paper-portfolio.json
      - name: Build installable PWA
        run: npm --prefix ui run build
        env:
          VITE_DATA_MODE: static
          VITE_STATIC_HOST: "true"
      - name: Verify deployment data
        shell: bash
        run: |
          test -s ui/dist/data/manifest.json
          test -s ui/dist/data/snapshot.parquet
          test -s ui/dist/data/horizon-board.json
          test -s ui/dist/data/paper-portfolio.json
          for index in $(seq -w 0 255); do
            number=$(printf '%03d' "$((10#$index))")
            test -s "ui/dist/data/companies-$number.json"
            test -s "ui/dist/data/prices-$number.json"
          done
          test -s ui/dist/manifest.webmanifest
          test -s ui/dist/sw.js
          test "$(du -sm ui/dist | cut -f1)" -lt 900
          touch ui/dist/.nojekyll
      - name: Preserve simulated holdings and decisions
        shell: bash
        run: |
          if ! git diff --quiet -- paper/ledger.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/ledger.json
            git commit -m "Advance paper portfolio through $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
